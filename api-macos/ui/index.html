<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"><title>API</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><img src="../assets/brand.png" alt="剧海"><b>API</b></div><button id="settings" aria-label="设置">⚙</button></header>
<section class="heading"><h1>选择你的 AI</h1><p>选择平台，输入分发的 API Key。</p></section>
<main><button id="gpt" class="card"><img src="../assets/openai.png" alt=""><strong>GPT</strong><span>Codex / 本地工作</span><small id="gptState">未配置</small></button><button id="chat" class="card chat"><div class="logos"><img src="../assets/claude.png" alt=""><img src="../assets/gemini.png" alt=""></div><strong>Claude · Gemini</strong><span>多模型对话</span><small id="chatState">接入任意一个分发 Key</small></button></main>
<p id="status" role="status">基础地址已预置。本程序访问树莓派时直连。</p><footer><span id="connection">树莓派 · 正在连接</span><span id="version">v1.0.17</span></footer>
<dialog id="connect"><form id="keyForm"><h2 id="connectTitle">连接平台</h2><p id="baseAddress"></p><div id="gptKeys"><label for="key">GPT 分发 Key</label><input id="key" type="password" maxlength="4096" autocomplete="off"></div><div id="chatKeys" hidden><label for="geminiKey">Gemini Key</label><input id="geminiKey" type="password" maxlength="4096" autocomplete="off"><label for="claudeKey">Claude Key</label><input id="claudeKey" type="password" maxlength="4096" autocomplete="off"><p>任意填写一个即可进入。留空保留已保存的 Key；更换 Key 使用独立会话空间，原历史仍保留。</p></div><label class="remember"><input id="remember" type="checkbox" checked> 记住 Key（Mac 钥匙串加密）</label><p id="connectStatus" role="status"></p><div class="actions"><button type="button" id="nativeClaude" hidden>Claude 原生桌面</button><button type="button" id="cancel">取消</button><button type="button" id="save">仅保存 Key</button><button type="submit" class="primary" id="apply">保存并打开</button></div></form></dialog>
<dialog id="preferences"><form id="settingsForm"><h2>API 设置</h2><label for="server">树莓派根地址</label><input id="server" type="url" required><label for="codexPath">Codex 应用路径（留空时 Cockpit 自动识别）</label><input id="codexPath" placeholder="/Applications/Codex.app"><label for="claudePath">Claude 官方桌面路径（留空时自动识别）</label><input id="claudePath" placeholder="/Applications/Claude.app"><label for="closeAction">关闭主窗口时</label><select id="closeAction"><option value="ask">每次询问</option><option value="tray">保留在菜单栏</option><option value="exit">直接退出</option></select><p>树莓派请求使用应用内直连，保留你当前的 VPN 和代理。</p><div class="actions"><button type="button" id="settingsCancel">取消</button><button type="submit" class="primary">保存设置</button></div></form></dialog>
<script src="main.js"></script></body></html>
